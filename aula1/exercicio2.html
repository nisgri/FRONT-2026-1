<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
</head>
<body>
    <header>
        <h1>Formulário de Inscrição para Auxiliar de Promotoria do MP/SP</h1>
        <p>Para todos os candidatos que almejam o cargo de Auxiliar de Promotoria do concurso do MP/SP 2026.</p>
    </header>

    <main>
        <section>
            <form>
            <fieldset>
                    <legend>Dados do Candidato(a)</legend>
                    <p>Informe abaixo os dados do Candidato(a):</p>
                    <div>
                        <label for="nome">Nome (*):</label><br>
                        <input type="text" id="nome" name="nome" required><br>
                    </div>
                    <div>
                        <label for="social">Nome Social:</label><br>
                        <input type="text" id="social" name="social"><br>
                    </div>
                    <div>
                        <label for="cpf">CPF (*):</label><br>
                        <input type="text" id="cpf" name="cpf" required><br>
                    </div>
                    <div>
                        <label for="nascimento">Data de Nascimento (*):</label><br>
                        <input type="date" id="nascimento" name="nascimento" required><br>
                    </div>
                    <div>
                        <label for="endereco">Endereço (*):</label><br>
                        <input type="text" id="endereco" name="endereco" required><br>
                    </div>
                    <div>
                        <label for="cep">CEP (*):</label><br>
                        <input type="text" id="cep" name="cep" required><br>
                    </div>
                    <div>
                        <label for="estado">Estado (*):</label><br>
                        <select name="estado" id="estado">
                            <option value="SP">SP</option>
                            <option value="RJ">RJ</option>
                            <option value="PR">PR</option>
                            <option value="MG">MG</option>
                            <option value="MS">MS</option>
                        </select><br>
                    </div>
                    <div>
                        <label for="email">Email (*):</label><br>
                        <input type="email" id="email" name="email" required><br>
                    </div>
                    <div>
                        <label for="telefone">Telefone (*):</label><br>
                        <input type="text" id="telefone" name="telefone" required><br>
                    </div>
                    <div>
                    <p>Nacionalidade:</p>
                        <input type="radio" id="nacionalidade" name="nacionalidade" value="Brasileiro(a)">
                        <label for="nacionalidade">Brasileiro(a)</label><br>
                        <input type="radio" id="nacionalidade" name="nacionalidade" value="Estrangeiro(a)">
                        <label for="nacionalidade">Estrangeiro(a)</label><br>
                    </div>
                </fieldset>
                <div>
                    <br>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
