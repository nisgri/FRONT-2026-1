<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endereços com ViaCEP</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f4f0;
        color: #1a1a18;
        min-height: 100vh;
        padding: 2rem 1rem;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      header p {
        font-size: 14px;
        color: #6b6a65;
        margin-bottom: 1.5rem;
      }

      /* ── CARD ── */
      .card {
        background: #fff;
        border: 0.5px solid #e0ddd5;
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }

      /* ── FORMULÁRIO ── */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .full {
        grid-column: 1 / -1;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .field label {
        font-size: 12px;
        font-weight: 500;
        color: #6b6a65;
      }

      .field input {
        height: 38px;
        padding: 0 12px;
        border: 0.5px solid #c8c5bc;
        border-radius: 8px;
        font-size: 14px;
        background: #f5f4f0;
        color: #1a1a18;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .field input:focus {
        outline: none;
        border-color: #534ab7;
        box-shadow: 0 0 0 3px rgba(83, 74, 183, 0.1);
      }

      /* ── BOTÕES ── */
      .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .btn {
        height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 0.5px solid #c8c5bc;
        background: transparent;
        color: #1a1a18;
        transition: background 0.12s;
      }

      .btn:hover {
        background: #f5f4f0;
      }

      .btn.primary {
        background: #534ab7;
        color: #fff;
        border-color: transparent;
      }

      .btn.primary:hover {
        background: #3c3489;
      }

      @media (max-width: 540px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .full {
          grid-column: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Cadastro de Endereço</h1>
        <p>Preencha o CEP para buscar o endereço.</p>
      </header>

      <div class="card">
        <div class="form-grid">
          <div class="field">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Ex: João Silva" />
          </div>

          <div class="field">
            <label for="cep">CEP</label>
            <div class="cep-wrap">
              <input
                type="text"
                id="cep"
                placeholder="00000-000"
                maxlength="9"
                oninput="maskCEP(this)"
              />
            </div>
          </div>

          <div class="field full">
            <label for="logradouro">Logradouro</label>
            <input
              type="text"
              id="logradouro"
              placeholder="Preenchido automaticamente"
            />
          </div>

          <div class="field">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" placeholder="Bairro" />
          </div>

          <div class="field">
            <label for="numero">Número</label>
            <input type="text" id="numero" placeholder="123" />
          </div>

          <div class="field">
            <label for="localidade">Cidade</label>
            <input
              type="text"
              id="localidade"
              placeholder="Preenchida automaticamente"
            />
          </div>

          <div class="field">
            <label for="uf">UF</label>
            <input type="text" id="uf" placeholder="RJ" maxlength="2" />
          </div>
        </div>

        <div id="status" class="status"></div>

        <div class="btn-row">
          <button class="btn primary" type="submit">Salvar</button>
          <button class="btn" type="reset">Limpar</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    function maskCEP(input) {
      let value = input.value.replace(/\D/g, "");
      if (value.length > 5) value = value.slice(0, 5) + "-" + value.slice(5, 8);

      input.value = value;

      if (value.replace(/\D/g, "").length === 8) buscarCEP(value);
    }

    async function buscarCEP(cep) {
      let cepTratado = cep.replace(/\D/g, "");

      try {
        const resp = await fetch(
          `https://viacep.com.br/ws/${cepTratado}/json/`,
        );
        const data = await resp.json();

        if (data.erro) {
          console.log("CEP não encontrado!");
          return;
        }

        document.getElementById("logradouro").value = data.logradouro || "";
        document.getElementById("bairro").value = data.bairro || "";
        document.getElementById("localidade").value = data.localidade || "";
        document.getElementById("uf").value = data.uf || "";

        document.getElementById("numero").focus();
      } catch (error) {
        console.log("Erro ao buscar CEP", error);
      }
    }
  </script>
</html>
